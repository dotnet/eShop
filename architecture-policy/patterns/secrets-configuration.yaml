kind: Pattern
schema_version: 1
id: PAT-SECRETS-CONFIGURATION
name: Secrets from configuration providers
category: security
summary: Secrets come from Aspire parameters, user-secrets, environment variables or Key Vault - never source.
intent: Keep credentials out of Git and rotate them without code changes.
rules:
- SEC-001
- SEC-004
- SEC-005
guidance:
- 'Model secrets as builder.AddParameter("name", secret: true) in the AppHost.'
- Read values via IConfiguration/IOptions in services.
- Use managed signing keys; never AddDeveloperSigningCredential outside development.
exemplars:
- path: src/eShop.AppHost/AppHost.cs
  symbol: AppHost
  description: Resource and parameter wiring.
examples:
- id: config-secret
  title: Secret read from configuration
  kind: approved
  language: csharp
  code: |
    options.ClientSecret = builder.Configuration["Identity:ClientSecret"];
  explanation: Value supplied by user-secrets/Key Vault.
- id: hardcoded-secret
  title: Hard-coded client secret
  kind: anti_pattern
  language: csharp
  code: |
    options.ClientSecret = "secret";
  explanation: Committed credential (SEC-001).
