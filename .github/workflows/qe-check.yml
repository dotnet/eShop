name: QE check

permissions:
  contents: read

# QE stage gate, called by ai-pipeline.yml:
# - stories changed in the PR have a test plan that passed the plan verifier (10/10) for the current story text
# - automated tests and scenarios for those stories passed the automation verifier and were not edited afterwards
on:
  workflow_call:
    inputs:
      base-ref:
        description: Ref to diff against, for example origin/main
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Story plans and tests are verifier-approved
      env:
        BASE_REF: ${{ inputs.base-ref }}
      run: node scripts/qe/qe.mjs check --changed-from "$BASE_REF"
