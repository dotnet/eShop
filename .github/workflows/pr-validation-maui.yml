name: eShop Pull Request Validation - .NET MAUI

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
    paths:
      - 'src/ClientApp/**'
      - 'tests/ClientApp.UnitTests/**'
      - '.github/workflows/pr-validation-maui.yml'

jobs:
  # Always runs on PRs so the required check below always reports a status;
  # when no relevant files changed, the check is skipped (which counts as passing).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      maui: ${{ steps.filter.outputs.maui }}
    steps:
    - id: filter
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
        if grep -qE '^(src/ClientApp/|tests/ClientApp\.UnitTests/|\.github/workflows/pr-validation-maui\.yml$)' <<< "$files"; then
          echo "maui=true" >> "$GITHUB_OUTPUT"
        else
          echo "maui=false" >> "$GITHUB_OUTPUT"
        fi

  maui:
    # Runs on push, when relevant files changed, or if change detection failed (fail-safe).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.maui == 'true') }}
    needs: changes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3

      - name: Update Workloads
        run: dotnet workload update

      - name: Install Workloads
        shell: pwsh
        run: |
          dotnet workload install android
          dotnet workload install ios
          dotnet workload install maccatalyst
          dotnet workload install maui

      - name: Build 
        run: dotnet build src/ClientApp/ClientApp.csproj
        
      - name: Test
        run: dotnet test --project tests/ClientApp.UnitTests/ClientApp.UnitTests.csproj --no-progress --output detailed