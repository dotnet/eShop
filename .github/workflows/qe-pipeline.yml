name: QE pipeline

permissions:
  contents: read

# Enforces the QE agent pipeline without calling any LLM:
# - stories changed in the PR have a test plan that passed the plan verifier (10/10) for the current story text
# - automated tests and scenarios for those stories passed the automation verifier and were not edited afterwards
on:
  pull_request:
    paths:
      - 'product-research/stories/**'
      - 'tests/**'
      - 'e2e/**'
      - 'testing/scenarios/**'
      - 'scripts/qe/**'
      - 'scripts/hooks/**'
      - '.github/agents/**'
      - '.github/workflows/qe-pipeline.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Pipeline unit and end-to-end tests
      run: node --test scripts/qe/test/*.test.mjs
    - name: Story plans and tests are verifier-approved
      run: node scripts/qe/qe.mjs check --changed-from origin/${{ github.base_ref }}
