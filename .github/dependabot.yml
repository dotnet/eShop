version: 2
registries:
  public-nuget:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
updates:
  - package-ecosystem: nuget
    directory: "/"
    registries:
      - public-nuget
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    ignore:
      # Stay on the last MediatR version before its license change.
      - dependency-name: "MediatR"
        update-types:
          - "version-update:semver-major"
    groups:
      # Packages that ship with .NET / Aspire releases and must be versioned together.
      platform:
        patterns:
          - "Aspire.*"
          - "CommunityToolkit.Aspire.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.*"
          - "Microsoft.Bcl.*"
          - "Microsoft.DotNet.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.OpenApi"
          - "Npgsql*"
      other:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      browser-testing:
        dependency-type: development
        patterns:
          - "*"
