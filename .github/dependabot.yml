version: 2
registries:
  public-nuget:
    type: nuget-feed
    url: https://api.nuget.org/v3/index.json
updates:
  - package-ecosystem: nuget
    directory: "/"
    registries:
      - public-nuget
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    # EF major upgrades require coordinated runtime, provider, and tooling changes.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types:
          - "version-update:semver-major"
    groups:
      Aspire:
        patterns:
          - "Aspire.*"
          - "Microsoft.Extensions.ServiceDiscovery.*"
      Azure:
        patterns:
          - "Azure.*"
          - "Microsoft.Azure.*"
          - "Microsoft.Extensions.Azure"
      AspNetCoreHealthChecks:
        patterns:
          - "AspNetCore.HealthChecks.*"
      AspNetCore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.Extensions.Features"
      MicrosoftExtensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.Bcl.*"
      EntityFrameworkCore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
      FluentUi:
        patterns:
          - "Microsoft.FluentUI.*"
      OpenTelemetry:
        patterns:
          - "OpenTelemetry.*"
      Npgsql:
        patterns:
          - "Npgsql.*"
      MicrosoftDotNet:
        patterns:
          - "Microsoft.DotNet.*"
      Grpc:
        patterns:
          - "Grpc.*"
      Pgvector:
        patterns:
          - "Pgvector.*"
      Duende:
        patterns:
          - "Duende.*"
      MSTest:
        patterns:
          - "MSTest.*"
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      browser-testing:
        dependency-type: development
        patterns:
          - "*"
